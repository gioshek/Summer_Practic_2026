features:
  gaussian_sigmas: [1, 2, 4, 8]
  gradient_sigmas: [1, 2, 4]
  local_std_sigmas: [2, 4, 8]
  robust_low_percentile: 1.0
  robust_high_percentile: 99.0
  include_color_features: false
  include_local_normalized: true

training:
  random_seed: 2026
  max_image_side: 1000
  boundary_margin_px: 3
  max_pixels_per_image_per_class: 3500
  target_train_pixels_per_class: 30000
  max_test_pixels_per_class: 15000
  balance_to_smallest_class: true
  test_fraction: 0.25
  split_attempts: 5000
  min_sticker_train_images: 4
  min_sticker_test_images: 1
  n_estimators: 240
  max_depth: 22
  min_samples_leaf: 2
  n_jobs: -1

prediction:
  max_image_side: 1000
  chunk_size: 250000
  overlay_alpha: 0.45
  jpeg_quality: 92
